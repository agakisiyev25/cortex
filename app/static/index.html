<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CorteX — Voice OR Co-Pilot</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/atkinson-hyperlegible-next@5.3.0/index.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/atkinson-hyperlegible-mono@5.3.0/index.css">
  <link rel="stylesheet" href="/static/css/cortex.css">
</head>
<body>
  <div id="app">
    <header id="topbar">
      <div class="brand">CorteX</div>
      <div class="case" aria-label="Current case">
        <span id="case-id" class="case-id">—</span>
        <span id="case-procedure" class="case-proc">Loading patient record…</span>
        <span id="allergy-chip" class="chip chip-alarm">Allergies: —</span>
      </div>
      <div class="session">
        <span id="live-status" class="status" data-state="offline"><i></i><b id="live-status-text">Offline</b></span>
        <time id="session-timer" class="timer">00:00</time>
        <span class="disclaimer">Research prototype, not for clinical use</span>
      </div>
    </header>

    <main id="viewers">
      <section id="mri-panel" class="well viewer-panel" aria-label="MRI viewer">
        <header class="panel-header">
          <div id="mri-title" class="panel-title">MRI · T1c · Axial</div>
          <div class="panel-meta-group">
            <span id="mri-landmark" class="landmark-chip" hidden></span>
            <span id="mri-slice-meta" class="panel-meta">Slice — / —</span>
          </div>
        </header>
        <div id="mri-body" class="viewer-body mri-body">
          <canvas id="ct-canvas"></canvas>
          <div class="slice-track" aria-hidden="true"><div id="slice-marker"></div></div>
        </div>
        <footer id="mri-legend" class="viewer-footer"></footer>
        <div class="viewer-placeholder">MRI hidden</div>
      </section>

      <section id="ar-panel" class="well well-3d viewer-panel" aria-label="3D patient model">
        <header class="panel-header">
          <div class="panel-title">3D · Patient-specific model</div>
          <span id="ar-view-name" class="panel-meta">Default</span>
        </header>
        <div id="ar-body" class="viewer-body ar-body"><canvas id="ar-canvas"></canvas></div>
        <footer id="ar-legend" class="viewer-footer"></footer>
        <div class="viewer-placeholder">3D model hidden</div>
      </section>

      <aside id="drawer" aria-label="Details" aria-live="polite"><div class="drawer-inner"></div></aside>
      <div id="banner-slot" aria-live="assertive"></div>
      <div id="modal-slot" aria-live="polite"></div>
    </main>

    <aside id="rail">
      <section id="orb-section">
        <button id="orion-orb" class="orb offline" type="button" aria-label="Connect to CorteX">
          <span class="orb-core"></span><span class="orb-ripple"></span>
        </button>
        <div id="orion-status-label">Tap to connect</div>
        <button id="voice-mode-toggle" type="button" aria-pressed="false">Push-to-talk</button>
        <button id="disconnect-button" type="button" hidden>Disconnect</button>
      </section>

      <section id="conversation-section" class="rail-section">
        <h2>Conversation</h2>
        <div id="transcript-log" aria-live="polite"></div>
      </section>

      <section id="actions-section" class="rail-section">
        <h2>Actions</h2>
        <div id="actions-feed" aria-live="polite"></div>
      </section>

      <form id="typed-command">
        <label class="sr-only" for="typed-input">Type a command</label>
        <input id="typed-input" placeholder="Type a command…" autocomplete="off">
        <button type="submit">Send</button>
      </form>
    </aside>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="/static/js/ct-viewer.js"></script>
  <script src="/static/js/anatomy-3d.js"></script>
  <script src="/static/js/overlays.js"></script>
  <script type="module" src="/static/js/app.js"></script>
</body>
</html>
